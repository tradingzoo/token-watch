# Runs the token watch on GitHub's servers, so the site updates without the PC on.
# Every 15 minutes (GitHub can start it a few minutes late). Run it by hand: Actions tab > scan > Run workflow.
name: scan

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min, off the busy :00/:15/:30/:45 marks (GitHub drops runs then)
  workflow_dispatch:

permissions:
  contents: write

concurrency:          # one scan at a time; a late one waits instead of overlapping
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # every Pons launch ever (pons_launches.csv), too big for the repo
      - name: Restore Pons launch list
        uses: actions/cache/restore@v4
        with:
          path: |
            data/pons_launches.csv
            data/pons_launches_meta.json
          key: pons-launches-${{ github.run_id }}
          restore-keys: pons-launches-

      - name: GitHub watch (watch.py)
        env:
          GH_TOKEN: ${{ github.token }}
          # Shortlist phone alerts (notify.py). Empty = off. Set in Settings > Secrets and variables > Actions.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -X utf8 watch.py

      # 30-day test check, once an hour (more runs = better record of each token's highest point)
      - name: 30-day test check (scan.py)
        run: |
          if [ "$(date -u +%M)" -lt 15 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -X utf8 scan.py > last_run.txt 2>&1 || cat last_run.txt
          else
            echo "not this run (once an hour)"
          fi

      - name: Save Pons launch list
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/pons_launches.csv
            data/pons_launches_meta.json
          key: pons-launches-${{ github.run_id }}

      - name: Save results and publish the page
        run: |
          git config user.name "token-watch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -q -m "Scan $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && exit 0; sleep 5; done
          exit 1
